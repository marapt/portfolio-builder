  <path d="M13 10h38v20.5c0 12-8.1 20.6-19 24-10.9-3.4-19-12-19-24V10z" fill="#0D395F" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M16.5 13.5h31v16.5c0 9.8-6.4 17-15.5 20-9.1-3-15.5-10.2-15.5-20V13.5z" fill="none" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Top-left globe -->
  <circle cx="24" cy="21" r="4.6" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <ellipse cx="24" cy="21" rx="2.1" ry="4.6" fill="none" stroke="#FFFFFF" stroke-width="1.1"/>
  <line x1="19.4" y1="21" x2="28.6" y2="21" stroke="#FFFFFF" stroke-width="1.1"/>
  <!-- Top-right open book -->
  <path d="M34.5 17.5c2 0 3.8.6 5.5 1.7 1.7-1.1 3.5-1.7 5.5-1.7v7.2c-2 0-3.8.5-5.5 1.5-1.7-1-3.5-1.5-5.5-1.5v-7.2z" fill="#FFFFFF"/>
  <line x1="40" y1="19" x2="40" y2="26.2" stroke="#0D395F" stroke-width="1.2"/>
  <!-- Building portico silhouette -->
  <path d="M18.5 31.5L32 27.2l13.5 4.3v1.8h-27v-1.8z" fill="#FFFFFF"/>
  <rect x="20" y="34" width="24" height="8" rx="0.8" fill="#FFFFFF"/>
  <rect x="22.5" y="36" width="3" height="6" rx="1.4" fill="#0D395F"/>
  <rect x="30.5" y="36" width="3" height="6" rx="1.4" fill="#0D395F"/>
  <rect x="38.5" y="36" width="3" height="6" rx="1.4" fill="#0D395F"/>
  <!-- 1955 founding year -->
  <text x="32" y="48.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="6.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">1955</text>
</svg>
